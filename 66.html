<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@dadiguz</title>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    /* Sutil: blanco-amarillo en centro, amarillo puro en los bordes */
    background: radial-gradient(ellipse at 50% 60%, rgba(249,112,62,0.12) 0%, transparent 65%), #F9F496;
  }

  /* ── Entrance animations ── */
  @keyframes scaleSpring {
    0%   { opacity: 0; transform: scale(0.6); }
    60%  { transform: scale(1.06); }
    80%  { transform: scale(0.97); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-6px); }
  }
  @keyframes rotateBorder {
    to { transform: rotate(360deg); }
  }

  /* ── Avatar ── */
  .avatar-outer {
    position: relative;
    width: 7rem; height: 7rem;
    animation: scaleSpring 0.7s cubic-bezier(0.34,1.56,0.64,1) both,
               float 4.5s ease-in-out 0.8s infinite;
  }
  /* spinning gradient ring */
  .avatar-outer::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 9999px;
    background: conic-gradient(#F9703E 0deg, #F9F496 90deg, #ffd560 200deg, #F9703E 360deg);
    animation: rotateBorder 3s linear infinite;
    z-index: 0;
  }
  /* white mask so ring doesn't bleed into image */
  .avatar-outer::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 9999px;
    background: #fff;
    z-index: 1;
  }
  .avatar-img {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    border-radius: 9999px;
    overflow: hidden;
    border: 3px solid #fff;
  }
  .avatar-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* ── Profile text ── */
  .anim-name { animation: fadeUp 0.5s ease both; animation-delay: 0.38s; }
  .anim-sub  { animation: fadeUp 0.5s ease both; animation-delay: 0.50s; }

  /* ── Linktree-style buttons ── */
  .link-card {
    animation: fadeUp 0.5s ease both;
    opacity: 0;
  }
  .link-card:nth-child(1) { animation-delay: 0.62s; }
  .link-card:nth-child(2) { animation-delay: 0.76s; }

  .link-pill {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    border-radius: 9999px;
    border: 2px solid #14191f;
    background: #fff;
    box-shadow: 4px 4px 0px #14191f;
    padding: 0.8rem 1rem;
    text-decoration: none;
    color: #14191f;
    font-weight: 800;
    font-size: 1rem;
    transition: transform 0.14s ease, box-shadow 0.14s ease;
    will-change: transform;
    gap: 0;
  }
  .link-pill:hover {
    transform: translate(2px, 2px);
    box-shadow: 3px 3px 0px #14191f;
  }
  .link-pill:active {
    transform: translate(4px, 4px);
    box-shadow: 0px 0px 0px #14191f;
  }

  /* Icon circle on left */
  .pill-icon {
    width: 2.2rem; height: 2.2rem;
    border-radius: 9999px;
    border: 1.5px solid #14191f;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    background: transparent;
  }

  /* Label truly centered inside pill */
  .pill-label {
    position: absolute;
    left: 0; right: 0;
    text-align: center;
    pointer-events: none;
  }

  /* ── Footer ── */
  .anim-brand {
    animation: fadeUp 0.5s ease both;
    animation-delay: 0.90s;
  }
</style>
</head>
<body>
<div class="min-h-screen flex flex-col items-center justify-center px-6 py-16">

    <div class="avatar-outer">
      <div class="avatar-img">

    </div>

        @dadiguz

      <p class="anim-sub text-sm font-semibold text-[#14191f]/50 mt-0.5">Creador de Pacepal · Runner</p>

            </svg>
          </div>

      </div>

      <!-- Spotify -->
      <div class="link-card">
        <a href="https://open.spotify.com/playlist/2bw52MNBU9H5TqRQe3afzj?si=e2aEDG9eQK2kCHHSfn5UqA&pi=282hLEZNQ7yq1"

           class="link-pill">
          <div class="pill-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
            </svg>
          </div>
          <span class="pill-label">Spotify</span>
        </a>
      </div>

      <!-- Contacto -->
      <div class="link-card" style="animation-delay: 0.90s;">
        <a href="mailto:dario.diaz@dallio.io"
           class="link-pill">
          <div class="pill-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </div>
          <span class="pill-label">Contacto</span>
        </a>
      </div>

    </div>

    <!-- Pacepal brand -->
    <div class="anim-brand mt-2">
      <a href="/" class="flex items-center gap-1.5 opacity-35 hover:opacity-60 transition-opacity">
        <img src="assets/logo_bueno.png" alt="Pacepal" style="height: 1rem; width: auto;">
      </a>
    </div>

  </div>
</div>
</body>
</html>
